name: build

on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: Runner label for the ppc64le job (ubuntu-26.04 = emulated under QEMU)
        default: ubuntu-24.04-ppc64le
      luajit_ref:
        description: Override LUAJIT_REF (empty = Dockerfile default)
        default: ""
  push:
    branches: [main]
    tags: ['v*']
    # Path filters apply to branch pushes only; tag pushes always build.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    # Native runners come from IBM actionspz (power-z-gha-runner app).
    # s390x is a build + smoke validation only; it never publishes anything.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ppc64le
            runner: ${{ inputs.runs-on || 'ubuntu-24.04-ppc64le' }}
            publish: true
          - arch: s390x
            runner: ubuntu-24.04-s390x
            publish: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Refuse release builds with an overridden LuaJIT ref
        if: startsWith(github.ref, 'refs/tags/v') && inputs.luajit_ref != ''
        run: |
          echo "Releases must use the Dockerfile's default LUAJIT_REF; luajit_ref overrides are for non-release runs." >&2
          exit 1

      - name: Classify run
        id: kind
        env:
          LUAJIT_REF_INPUT: ${{ inputs.luajit_ref }}
          ARCH: ${{ matrix.arch }}
        run: |
          if [ "$(uname -m)" = "$ARCH" ]; then echo "kind=native" >> "$GITHUB_OUTPUT"
          else echo "kind=emulated" >> "$GITHUB_OUTPUT"; fi
          ljref="${LUAJIT_REF_INPUT:-$(sed -n 's/^ARG LUAJIT_REF=//p' Dockerfile)}"
          ljrepo="$(sed -n 's/^ARG LUAJIT_REPO=//p' Dockerfile)"
          ocver="$(sed -n 's/^ARG OPENRESTY_VERSION=//p' Dockerfile | head -n1)"
          {
            echo "luajit_ref=$ljref"
            echo "luajit_repo=$ljrepo"
            echo "openresty_version=$ocver"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
        if: steps.kind.outputs.kind == 'emulated'
      - uses: docker/setup-buildx-action@v4
      # Exposes the cache credentials to the plain `docker buildx` CLI below.
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build image
        env:
          LUAJIT_REF_INPUT: ${{ inputs.luajit_ref }}
          ARCH: ${{ matrix.arch }}
        run: |
          ARGS=()
          if [ -n "$LUAJIT_REF_INPUT" ]; then ARGS+=(--build-arg "LUAJIT_REF=$LUAJIT_REF_INPUT"); fi
          docker buildx build --platform "linux/$ARCH" --load "${ARGS[@]}" \
            --cache-from "type=gha,scope=$ARCH" \
            --cache-to "type=gha,scope=$ARCH,mode=max" \
            --target runtime -t "${IMAGE,,}:ci" .

      - name: Smoke tests
        env:
          ARCH: ${{ matrix.arch }}
        run: docker run --rm --platform "linux/$ARCH" "${IMAGE,,}:ci" smoke.sh

      - name: Export tarball
        if: matrix.publish
        env:
          LUAJIT_REF_INPUT: ${{ inputs.luajit_ref }}
        run: |
          ARGS=()
          if [ -n "$LUAJIT_REF_INPUT" ]; then ARGS+=(--build-arg "LUAJIT_REF=$LUAJIT_REF_INPUT"); fi
          docker buildx build --platform linux/ppc64le --target export "${ARGS[@]}" \
            --cache-from type=gha,scope=ppc64le \
            --output type=tar,dest=openresty-ppc64le.tar .
          gzip -f openresty-ppc64le.tar

      - uses: actions/upload-artifact@v7
        if: matrix.publish
        with:
          name: openresty-ppc64le-${{ steps.kind.outputs.kind }}
          path: openresty-ppc64le.tar.gz

      - name: Log in to GHCR
        if: matrix.publish && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags publish :<tag>. Pushes to main publish :testing and :sha-<short>.
      # workflow_dispatch runs never push, so a scratch build can't clobber :testing.
      - name: Push image
        if: matrix.publish && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAGS=("$GITHUB_REF_NAME")
          else
            TAGS=(testing "sha-${GITHUB_SHA::7}")
          fi
          for t in "${TAGS[@]}"; do
            docker tag "${IMAGE,,}:ci" "${IMAGE,,}:$t"
            docker push "${IMAGE,,}:$t"
          done

      - name: Release
        if: matrix.publish && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: openresty-ppc64le.tar.gz
          # Unofficial build of an unreviewed LuaJIT fix; never present as stable.
          prerelease: true
          body: |
            UNOFFICIAL ppc64le build (caveat emptor). Built **${{ steps.kind.outputs.kind }}**.

            - OpenResty ${{ steps.kind.outputs.openresty_version }}, bundled LuaJIT replaced by `${{ steps.kind.outputs.luajit_repo }}` @ `${{ steps.kind.outputs.luajit_ref }}`
            - The LuaJIT fix is an unreviewed draft: https://github.com/openresty/luajit2/pull/279

            ${{ steps.kind.outputs.kind == 'emulated' && 'Emulated under QEMU: not validated on native POWER hardware.' || 'Built and smoke-tested on native ppc64le.' }}
